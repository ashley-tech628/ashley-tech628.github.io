<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img" aria-labelledby="title desc">
  <title id="title">RevProof V2 exact-match cascade</title>
  <desc id="desc">Across 100 silver development articles, the selected sentence-evidence pairs contained the gold sentence in 93 cases, the exact gold span was among eight candidates in 52 cases, the target replacement phrase was generated in 25 cases, and the exact candidate was selected in 20 cases.</desc>
  <rect width="1100" height="540" rx="16" fill="#f3f6fc"/>
  <text x="52" y="57" font-family="Arial,sans-serif" font-size="20" letter-spacing="2.5" fill="#526b90">V2 / ERROR LOCALIZATION</text>
  <text x="52" y="101" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#172844">Where exact revisions are lost</text>
  <g font-family="Arial,sans-serif" font-size="21" fill="#24395d">
    <text x="52" y="179">Target sentence in pairs</text><rect x="350" y="151" width="628" height="34" rx="4" fill="#254f91"/><text x="991" y="178" font-weight="700">93</text>
    <text x="52" y="263">Exact span proposed</text><rect x="350" y="235" width="351" height="34" rx="4" fill="#426db1"/><text x="714" y="262" font-weight="700">52</text>
    <text x="52" y="347">Target phrase generated</text><rect x="350" y="319" width="169" height="34" rx="4" fill="#7192ca"/><text x="532" y="346" font-weight="700">25</text>
    <text x="52" y="431">Exact candidate selected</text><rect x="350" y="403" width="135" height="34" rx="4" fill="#91aad3"/><text x="498" y="430" font-weight="700">20</text>
  </g>
  <line x1="350" y1="466" x2="1026" y2="466" stroke="#a5b6d0"/>
  <g font-family="Arial,sans-serif" font-size="17" fill="#607596"><text x="344" y="493">0</text><text x="473" y="493">20</text><text x="608" y="493">40</text><text x="743" y="493">60</text><text x="878" y="493">80</text><text x="1004" y="493">100</text></g>
  <text x="52" y="523" font-family="Arial,sans-serif" font-size="17" fill="#607596">Necessary silver-target conditions on the same 100 articles; counts are nested.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1035" viewBox="0 0 1000 1035" role="img" aria-labelledby="title desc"><title id="title">04 / Deterministic retrieval pipeline</title><desc id="desc">Eight stages · expanded from the supplied retrieval-flow reference</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#6982aa"/></marker></defs><rect width="1000" height="1035" fill="#fff"/><g font-family="Arial, sans-serif"><text x="36" y="44" fill="#172d50" font-size="27">04 / Deterministic retrieval pipeline</text><text x="36" y="76" fill="#50617c" font-size="17">Eight stages · expanded from the supplied retrieval-flow reference</text><rect x="36" y="112" width="288" height="110" rx="12" fill="#f2f5fd" stroke="#b6c6e7"/><text x="56" y="145" fill="#172d50" font-size="20">01  Authorization filter</text><text x="56" y="174" fill="#50617c" font-size="18">User / module context</text><text x="56" y="199" fill="#50617c" font-size="18">Eligible articles only</text><path d="M324 167 H351" fill="none" stroke="#6982aa" stroke-width="2" marker-end="url(#a)"/><rect x="356" y="112" width="288" height="110" rx="12" fill="#f2f5fd" stroke="#b6c6e7"/><text x="376" y="145" fill="#172d50" font-size="20">02  Query frame</text><text x="376" y="174" fill="#50617c" font-size="18">Parse the query</text><text x="376" y="199" fill="#50617c" font-size="18">Six-slot representation</text><path d="M644 167 H671" fill="none" stroke="#6982aa" stroke-width="2" marker-end="url(#a)"/><rect x="676" y="112" width="288" height="110" rx="12" fill="#f2f5fd" stroke="#b6c6e7"/><text x="696" y="145" fill="#172d50" font-size="20">03  Concept resolution</text><text x="696" y="174" fill="#50617c" font-size="18">Resolve query concepts</text><text x="696" y="199" fill="#50617c" font-size="18">Prepare retrieval inputs</text><path d="M820 222 V247 H500 V277" fill="none" stroke="#6982aa" stroke-width="2" marker-end="url(#a)"/><text x="36" y="288" fill="#172d50" font-size="21">04  Four parallel retrieval lanes</text><rect x="36" y="312" width="216" height="88" rx="12" fill="#f2f5fd" stroke="#b6c6e7"/><text x="56" y="345" fill="#172d50" font-size="20">Exact / phrase</text><text x="56" y="374" fill="#50617c" font-size="18">Literal matches</text><rect x="274" y="312" width="216" height="88" rx="12" fill="#f2f5fd" stroke="#b6c6e7"/><text x="294" y="345" fill="#172d50" font-size="20">BM25F</text><text x="294" y="374" fill="#50617c" font-size="18">Field weighting</text><rect x="512" y="312" width="216" height="88" rx="12" fill="#f2f5fd" stroke="#b6c6e7"/><text x="532" y="345" fill="#172d50" font-size="20">Concept</text><text x="532" y="374" fill="#50617c" font-size="18">Concept matches</text><rect x="750" y="312" width="214" height="88" rx="12" fill="#f2f5fd" stroke="#b6c6e7"/><text x="770" y="345" fill="#172d50" font-size="20">Fuzzy</text><text x="770" y="374" fill="#50617c" font-size="18">Edit-distance</text><path d="M144 400 V430 H500 V460" fill="none" stroke="#6982aa" stroke-width="2" marker-end="url(#a)"/><path d="M382 400 V430" fill="none" stroke="#6982aa" stroke-width="2" marker-end="url(#a)"/><path d="M620 400 V430 H500" fill="none" stroke="#6982aa" stroke-width="2" marker-end="url(#a)"/><path d="M857 400 V430 H620" fill="none" stroke="#6982aa" stroke-width="2" marker-end="url(#a)"/><rect x="170" y="462" width="660" height="90" rx="12" fill="#f2f5fd" stroke="#b6c6e7"/><text x="190" y="495" fill="#172d50" font-size="20">05  Reciprocal Rank Fusion</text><text x="190" y="524" fill="#50617c" font-size="18">Combine the four ranked candidate lists</text><path d="M500 552 V589" fill="none" stroke="#6982aa" stroke-width="2" marker-end="url(#a)"/><rect x="170" y="592" width="660" height="90" rx="12" fill="#f2f5fd" stroke="#b6c6e7"/><text x="190" y="625" fill="#172d50" font-size="20">06  Alignment tiering</text><text x="190" y="654" fill="#50617c" font-size="18">Organize candidates by alignment with the query</text><path d="M500 682 V719" fill="none" stroke="#6982aa" stroke-width="2" marker-end="url(#a)"/><rect x="170" y="722" width="660" height="90" rx="12" fill="#f2f5fd" stroke="#b6c6e7"/><text x="190" y="755" fill="#172d50" font-size="20">07  Confidence gate</text><text x="190" y="784" fill="#50617c" font-size="18">Apply decision thresholds to ranked candidates</text><path d="M500 812 V839 H185 V877" fill="none" stroke="#6982aa" stroke-width="2" marker-end="url(#a)"/><path d="M500 839 V877" fill="none" stroke="#6982aa" stroke-width="2" marker-end="url(#a)"/><path d="M500 839 H815 V877" fill="none" stroke="#6982aa" stroke-width="2" marker-end="url(#a)"/><rect x="36" y="880" width="296" height="88" rx="12" fill="#effaf6" stroke="#90cbb6"/><text x="56" y="913" fill="#172d50" font-size="20">08  HIGH</text><text x="56" y="942" fill="#50617c" font-size="18">Direct answer</text><rect x="352" y="880" width="296" height="88" rx="12" fill="#fff8eb" stroke="#dfbf80"/><text x="372" y="913" fill="#172d50" font-size="20">08  AMBIGUOUS</text><text x="372" y="942" fill="#50617c" font-size="18">Clarify</text><rect x="668" y="880" width="296" height="88" rx="12" fill="#f2f5fd" stroke="#b6c6e7"/><text x="688" y="913" fill="#172d50" font-size="20">08  LOW</text><text x="688" y="942" fill="#50617c" font-size="18">Fallback</text><text x="36" y="1010" fill="#50617c" font-size="17">Conceptual flow; no threshold values or relevance benchmark are inferred.</text></g></svg>
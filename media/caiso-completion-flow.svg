<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="910" viewBox="0 0 1000 910" role="img" aria-labelledby="title desc"><title id="title">03 / Assessment → qualification evidence</title><desc id="desc">A course pass and a successful task update are separate outcomes.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#6982aa"/></marker></defs><rect width="1000" height="910" fill="#fff"/><g font-family="Arial, sans-serif"><text x="36" y="44" fill="#172d50" font-size="27">03 / Assessment → qualification evidence</text><text x="36" y="76" fill="#50617c" font-size="17">A course pass and a successful task update are separate outcomes.</text><rect x="36" y="112" width="440" height="110" rx="12" fill="#f2f5fd" stroke="#b6c6e7"/><text x="56" y="145" fill="#172d50" font-size="20">Written assessment</text><text x="56" y="174" fill="#50617c" font-size="18">Points / maximum points</text><text x="56" y="199" fill="#50617c" font-size="18">Recorded component pass status</text><rect x="524" y="112" width="440" height="110" rx="12" fill="#f2f5fd" stroke="#b6c6e7"/><text x="544" y="145" fill="#172d50" font-size="20">Practical assessment</text><text x="544" y="174" fill="#50617c" font-size="18">Points / maximum points</text><text x="544" y="199" fill="#50617c" font-size="18">Recorded component pass status</text><path d="M250 222 V246 H500 V274" fill="none" stroke="#6982aa" stroke-width="2" marker-end="url(#a)"/><path d="M745 222 V246 H500" fill="none" stroke="#6982aa" stroke-width="2" marker-end="url(#a)"/><rect x="170" y="276" width="660" height="112" rx="12" fill="#f2f5fd" stroke="#b6c6e7"/><text x="190" y="309" fill="#172d50" font-size="20">Weighted result + pass decision</text><text x="190" y="338" fill="#50617c" font-size="18">SUM(points) / SUM(maximum points) × 100</text><text x="190" y="363" fill="#50617c" font-size="18">(32 + 8) / (40 + 10) = 80%; every recorded component must pass</text><path d="M500 388 V431" fill="none" stroke="#6982aa" stroke-width="2" marker-end="url(#a)"/><rect x="170" y="434" width="660" height="86" rx="12" fill="#effaf6" stroke="#90cbb6"/><text x="190" y="467" fill="#172d50" font-size="20">Persist course-completion record</text><text x="190" y="496" fill="#50617c" font-size="18">Only a passing result enters task-completion mapping</text><path d="M500 520 V561" fill="none" stroke="#6982aa" stroke-width="2" marker-end="url(#a)"/><rect x="36" y="564" width="928" height="111" rx="12" fill="#f2f5fd" stroke="#b6c6e7"/><text x="56" y="597" fill="#172d50" font-size="20">Choose the first nonempty mapping tier</text><text x="56" y="626" fill="#50617c" font-size="18">Objective tasks → otherwise class tasks → otherwise course tasks</text><text x="56" y="651" fill="#50617c" font-size="18">Deduplicate exact task revisions; do not union all three tiers</text><path d="M500 675 V713" fill="none" stroke="#6982aa" stroke-width="2" marker-end="url(#a)"/><rect x="36" y="716" width="566" height="118" rx="12" fill="#effaf6" stroke="#90cbb6"/><text x="56" y="749" fill="#172d50" font-size="20">Update eligible existing assignments</text><text x="56" y="778" fill="#50617c" font-size="18">Training-derived source; no invented evaluator</text><text x="56" y="803" fill="#50617c" font-size="18">No new assignment is created by this step</text><rect x="626" y="716" width="338" height="118" rx="12" fill="#fff8eb" stroke="#dfbf80"/><text x="646" y="749" fill="#172d50" font-size="20">Report both outcomes</text><text x="646" y="778" fill="#50617c" font-size="18">Mapped task count</text><text x="646" y="803" fill="#50617c" font-size="18">Newly completed count</text><text x="36" y="876" fill="#50617c" font-size="17">A missing mapping or eligible assignment does not erase the independent course pass.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="810" viewBox="0 0 1000 810" role="img" aria-labelledby="title desc"><title id="title">02 / Versioned qualification model</title><desc id="desc">Business identity, exact revision and individual evidence are different records.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#6982aa"/></marker></defs><rect width="1000" height="810" fill="#fff"/><g font-family="Arial, sans-serif"><text x="36" y="44" fill="#172d50" font-size="27">02 / Versioned qualification model</text><text x="36" y="76" fill="#50617c" font-size="17">Business identity, exact revision and individual evidence are different records.</text><rect x="36" y="112" width="278" height="112" rx="12" fill="#f2f5fd" stroke="#b6c6e7"/><text x="56" y="145" fill="#172d50" font-size="20">Stable task identity</text><text x="56" y="174" fill="#50617c" font-size="18">taskNum</text><text x="56" y="199" fill="#50617c" font-size="18">One requirement over time</text><path d="M314 168 H374" fill="none" stroke="#6982aa" stroke-width="2" marker-end="url(#a)"/><rect x="378" y="112" width="586" height="112" rx="12" fill="#f2f5fd" stroke="#b6c6e7"/><text x="398" y="145" fill="#172d50" font-size="20">Exact task revision</text><text x="398" y="174" fill="#50617c" font-size="18">taskId + taskVersion</text><text x="398" y="199" fill="#50617c" font-size="18">Referenced by card tasks and course / objective mappings</text><path d="M670 224 V267" fill="none" stroke="#6982aa" stroke-width="2" marker-end="url(#a)"/><rect x="378" y="270" width="586" height="110" rx="12" fill="#f2f5fd" stroke="#b6c6e7"/><text x="398" y="303" fill="#172d50" font-size="20">Qualification-card template</text><text x="398" y="332" fill="#50617c" font-size="18">A version-specific set of required tasks</text><text x="398" y="357" fill="#50617c" font-size="18">Template membership ≠ an individual assignment</text><rect x="36" y="270" width="278" height="110" rx="12" fill="#f2f5fd" stroke="#b6c6e7"/><text x="56" y="303" fill="#172d50" font-size="20">Person + position</text><text x="56" y="332" fill="#50617c" font-size="18">Dated position history</text><text x="56" y="357" fill="#50617c" font-size="18">Assignment context</text><path d="M175 380 V437" fill="none" stroke="#6982aa" stroke-width="2" marker-end="url(#a)"/><path d="M670 380 V408 H175 V437" fill="none" stroke="#6982aa" stroke-width="2" marker-end="url(#a)"/><rect x="36" y="440" width="440" height="120" rx="12" fill="#f2f5fd" stroke="#b6c6e7"/><text x="56" y="473" fill="#172d50" font-size="20">Individual card assignment</text><text x="56" y="502" fill="#50617c" font-size="18">Person + card version + effective interval</text><text x="56" y="527" fill="#50617c" font-size="18">Tracks which requirements applied when</text><path d="M476 500 H524" fill="none" stroke="#6982aa" stroke-width="2" marker-end="url(#a)"/><rect x="528" y="440" width="436" height="120" rx="12" fill="#f2f5fd" stroke="#b6c6e7"/><text x="548" y="473" fill="#172d50" font-size="20">Individual task assignment</text><text x="548" y="502" fill="#50617c" font-size="18">userTaskId → exact taskId</text><text x="548" y="527" fill="#50617c" font-size="18">Completion source / time / evaluator</text><path d="M250 560 V615" fill="none" stroke="#6982aa" stroke-width="2" marker-end="url(#a)"/><path d="M745 560 V590 H250 V615" fill="none" stroke="#6982aa" stroke-width="2" marker-end="url(#a)"/><rect x="36" y="618" width="928" height="110" rx="12" fill="#effaf6" stroke="#90cbb6"/><text x="56" y="651" fill="#172d50" font-size="20">Historical qualification view</text><text x="56" y="680" fill="#50617c" font-size="18">Use the card interval and task revision applicable at the requested date.</text><text x="56" y="705" fill="#50617c" font-size="18">Preserve old evidence when selected people move to a new card version.</text><text x="36" y="772" fill="#50617c" font-size="17">Logical relationships; arrows are not a claim of direct foreign keys in every legacy table.</text></g></svg>